_target_: ctd.task_modeling.task_env.actor_task.ActorTask
effector:
  _target_: motornet.effector.RigidTendonArm26
  muscle:
    _target_: motornet.muscle.MujocoHillMuscle
max_ep_duration: 1.55
action_noise: 0.005
proprioception_noise: 0.005
proprioception_delay: 0.02
vision_noise: 0.005
vision_delay: 0.05

act_weight: 1.0
pos_weight: 1.0

context_input_noise: 0.04

# ActorLoss
reach_radius: 0.02  # m
hold_ms: 100
trigger_shape: "pulse"  # or "step_decay"
trigger_ms: 40
decay_ms: 40  # step_decay only: fall from 1 to 0 after trigger_ms
trigger_weight: 1.0
full_trial_epoch: 200
